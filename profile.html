<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VIBES — Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --bg:#0a0a0a; --surface:#111; --border:#1e1e1e; --accent:#ff2d55; --accent2:#ff6b35; --text:#f0f0f0; --muted:#666; --gold:#ffd700; }
    body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

    .top-bar { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; position:sticky; top:0; z-index:10; background:var(--bg); border-bottom:1px solid var(--border); }
    .back-btn { background:none; border:none; color:var(--text); font-size:22px; cursor:pointer; }
    .username-title { font-size:16px; font-weight:600; }
    .menu-btn { background:none; border:none; color:var(--text); font-size:22px; cursor:pointer; }

    .profile-header { padding:24px 20px; text-align:center; border-bottom:1px solid var(--border); }
    .profile-avatar-wrap { position:relative; display:inline-block; margin-bottom:12px; }
    .profile-avatar { width:80px; height:80px; border-radius:50%; object-fit:cover; border:3px solid transparent; background:linear-gradient(var(--bg),var(--bg)) padding-box, linear-gradient(135deg,var(--accent),var(--accent2)) border-box; }
    .avatar-upload-btn { position:absolute; bottom:0; right:0; width:26px; height:26px; background:var(--accent); border:2px solid var(--bg); border-radius:50%; font-size:13px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
    .profile-display-name { font-size:20px; font-weight:700; margin-bottom:2px; }
    .profile-username { font-size:14px; color:var(--muted); margin-bottom:12px; }
    .profile-bio { font-size:14px; color:rgba(255,255,255,0.8); line-height:1.5; margin-bottom:16px; max-width:280px; margin-left:auto; margin-right:auto; }
    .stats-row { display:flex; justify-content:center; gap:40px; margin-bottom:20px; }
    .stat { text-align:center; }
    .stat-num { font-size:20px; font-weight:700; }
    .stat-label { font-size:12px; color:var(--muted); }
    .profile-actions { display:flex; gap:10px; justify-content:center; }
    .btn-follow { background:linear-gradient(135deg,var(--accent),var(--accent2)); border:none; border-radius:10px; color:white; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:600; padding:10px 32px; cursor:pointer; }
    .btn-follow.following { background:transparent; border:1px solid var(--border); color:var(--text); }
    .btn-msg { background:var(--surface); border:1px solid var(--border); border-radius:10px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:14px; font-weight:500; padding:10px 20px; cursor:pointer; }
    .profile-coins { display:inline-flex; align-items:center; gap:5px; background:rgba(255,215,0,0.1); border:1px solid rgba(255,215,0,0.25); border-radius:20px; padding:4px 12px; font-size:12px; font-weight:700; color:var(--gold); cursor:pointer; margin-bottom:12px; }
    .btn-wallet { background:rgba(255,215,0,0.1); border:1px solid rgba(255,215,0,0.25); border-radius:10px; color:var(--gold); font-family:'DM Sans',sans-serif; font-size:13px; font-weight:600; padding:8px 16px; cursor:pointer; }
    .btn-edit { background:var(--surface); border:1px solid var(--border); border-radius:10px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:14px; font-weight:500; padding:10px 32px; cursor:pointer; flex:1; max-width:200px; }

    /* ✅ FIX: Tabs use explicit IDs */
    .tabs-row { display:flex; border-bottom:1px solid var(--border); }
    .tab-btn { flex:1; padding:14px; background:none; border:none; color:var(--muted); font-family:'DM Sans',sans-serif; font-size:18px; cursor:pointer; border-bottom:2px solid transparent; transition:color 0.2s, border-color 0.2s; }
    .tab-btn.active { color:white; border-bottom-color:white; }

    .video-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:1px; }
    .video-thumb { aspect-ratio:9/16; position:relative; cursor:pointer; overflow:hidden; background:var(--surface); }
    .video-thumb video { width:100%; height:100%; object-fit:cover; transition:transform 0.2s; }
    .video-thumb:hover video { transform:scale(1.05); }
    .thumb-overlay { position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,0.6), transparent); }
    .thumb-stats { position:absolute; bottom:6px; left:8px; font-size:12px; font-weight:600; display:flex; align-items:center; gap:4px; text-shadow:0 1px 3px rgba(0,0,0,0.8); }

    .empty-state { padding:60px 20px; text-align:center; color:var(--muted); grid-column:1/-1; }
    .empty-state .emoji { font-size:40px; margin-bottom:12px; }
    .empty-state p { font-size:15px; }

    /* Edit modal */
    .modal-overlay { position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.8); display:flex; align-items:flex-end; opacity:0; pointer-events:none; transition:opacity 0.2s; }
    .modal-overlay.open { opacity:1; pointer-events:all; }
    .edit-sheet { background:var(--surface); border-radius:20px 20px 0 0; padding:24px 20px 40px; width:100%; max-height:80vh; overflow-y:auto; transform:translateY(100%); transition:transform 0.3s; }
    .modal-overlay.open .edit-sheet { transform:translateY(0); }
    .edit-title { font-size:18px; font-weight:700; margin-bottom:24px; }
    .form-group { margin-bottom:18px; }
    label { display:block; font-size:11px; font-weight:500; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
    input, textarea { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:12px 14px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:15px; outline:none; transition:border-color 0.2s; resize:none; }
    input:focus, textarea:focus { border-color:var(--accent); }
    input::placeholder, textarea::placeholder { color:var(--muted); }
    .save-btn { width:100%; padding:14px; background:linear-gradient(135deg,var(--accent),var(--accent2)); border:none; border-radius:12px; color:white; font-family:'DM Sans',sans-serif; font-size:15px; font-weight:600; cursor:pointer; margin-top:8px; }

    .bottom-nav { position:fixed; bottom:0; left:0; right:0; z-index:100; height:70px; background:rgba(0,0,0,0.95); display:flex; align-items:center; justify-content:space-around; border-top:1px solid var(--border); }
    .bottom-tab { display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--muted); text-decoration:none; font-size:10px; font-weight:500; transition:color 0.2s; position:relative; }
    .bottom-tab.active { color:white; }
    .notif-dot { position:absolute; top:-3px; right:-3px; background:var(--accent); color:white; font-size:9px; font-weight:700; padding:1px 5px; border-radius:10px; min-width:16px; text-align:center; display:none; }
    .upload-tab { background:linear-gradient(135deg,var(--accent),var(--accent2)); width:46px; height:32px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:22px; color:white; }
    .content-area { padding-bottom:80px; }

    .loader { display:flex; align-items:center; justify-content:center; padding:40px; }
    .spinner { width:30px; height:30px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg)} }
  </style>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#ff2d55"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
</head>
<body>

<div class="top-bar">
  <button class="back-btn" onclick="history.back()">←</button>
  <span class="username-title" id="topUsername">Profile</span>
  <button class="menu-btn" onclick="showOptions()">⋯</button>
</div>

<div class="content-area">
  <div class="profile-header" id="profileHeader">
    <div class="loader"><div class="spinner"></div></div>
  </div>

  <!-- ✅ FIX: Tabs with explicit IDs -->
  <div class="tabs-row">
    <button class="tab-btn active" id="tabVideos" onclick="switchTab('videos')">☰</button>
    <button class="tab-btn" id="tabLiked" onclick="switchTab('liked')">❤️</button>
  </div>

  <div class="video-grid" id="videoGrid">
    <div class="loader" style="grid-column:1/-1"><div class="spinner"></div></div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="editModal" onclick="closeEditOnOverlay(event)">
  <div class="edit-sheet">
    <div class="edit-title">Edit Profile</div>
    <div class="form-group"><label>Display Name</label><input type="text" id="editDisplayName" /></div>
    <div class="form-group"><label>Username</label><input type="text" id="editUsername" /></div>
    <div class="form-group"><label>Bio</label><textarea id="editBio" rows="3" maxlength="150"></textarea></div>
    <button class="save-btn" onclick="saveProfile()">Save Changes</button>
  </div>
</div>

<nav class="bottom-nav">
  <a class="bottom-tab" href="index.html">🏠<span>Home</span></a>
  <a class="bottom-tab" href="search.html">🔍<span>Discover</span></a>
  <a class="bottom-tab" href="upload.html"><div class="upload-tab">＋</div></a>
  <a class="bottom-tab" href="notifications.html">🔔<span>Notif</span><span class="notif-dot" id="notifBadge"></span></a>
  <a class="bottom-tab active" href="profile.html">👤<span>Profile</span></a>
</nav>

<script>
let currentUser = null;
let viewingProfile = null;
let isOwnProfile = false;
let isFollowing = false;
let activeTab = 'videos'; // ✅ track active tab

async function init() {
  currentUser = await getCurrentUser();
  const params = new URLSearchParams(window.location.search);
  const profileId = params.get('id');
  const targetId = profileId || currentUser?.id;
  if (!targetId) return window.location.href = 'auth.html';
  isOwnProfile = currentUser && currentUser.id === targetId;

  // Load notif badge
  if (currentUser) {
    sb.from('notifications').select('*',{count:'exact',head:true}).eq('user_id',currentUser.id).eq('is_read',false).then(({count}) => {
      if (count > 0) { const b = document.getElementById('notifBadge'); if(b){ b.textContent = count > 99 ? '99+' : count; b.style.display='block'; } }
    });
  }

  const { data: profile } = await sb.from('profiles').select('*').eq('id', targetId).single();
  if (!profile) { document.getElementById('profileHeader').innerHTML = '<p style="padding:20px;color:var(--muted)">Profil tidak dijumpai.</p>'; return; }

  viewingProfile = profile;
  document.getElementById('topUsername').textContent = '@' + profile.username;
  renderHeader(profile);
  loadVideos(profile.id);

  if (!isOwnProfile && currentUser) {
    const { data: f } = await sb.from('follows').select('id').eq('follower_id', currentUser.id).eq('following_id', profile.id).maybeSingle();
    isFollowing = !!f;
    updateFollowBtn();
  }
}

function renderHeader(profile) {
  const avatarSrc = getAvatarUrl(profile);
  document.getElementById('profileHeader').innerHTML = `
    <div class="profile-avatar-wrap">
      <img class="profile-avatar" src="${avatarSrc}" id="profileAvatar" alt="${profile.display_name}" />
      ${isOwnProfile ? `<label class="avatar-upload-btn" for="avatarInput">📷<input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="uploadAvatar(this)" /></label>` : ''}
    </div>
    <div class="profile-display-name">${profile.display_name || profile.username}</div>
    <div class="profile-username">@${profile.username}</div>
    ${profile.bio ? `<div class="profile-bio">${profile.bio}</div>` : ''}
    ${isOwnProfile ? `<div class="profile-coins" onclick="window.location.href='wallet.html'">💎 <span id="profileCoinsAmt">...</span> coins</div>` : ''}
    <div class="stats-row">
      <div class="stat"><div class="stat-num">${formatCount(profile.following_count)}</div><div class="stat-label">Following</div></div>
      <div class="stat"><div class="stat-num">${formatCount(profile.followers_count)}</div><div class="stat-label">Followers</div></div>
      <div class="stat"><div class="stat-num">${formatCount(profile.videos_count)}</div><div class="stat-label">Videos</div></div>
    </div>
    <div class="profile-actions">
      ${isOwnProfile
        ? `<button class="btn-edit" onclick="openEditModal()">Edit Profile</button>
           <button class="btn-wallet" onclick="window.location.href='wallet.html'">💎 Wallet</button>`
        : `<button class="btn-follow" id="followBtn" onclick="toggleFollow()">${isFollowing ? 'Following' : 'Follow'}</button><button class="btn-msg">Message</button>`}
    </div>`;

  // Load coins for own profile
  if (isOwnProfile) loadProfileCoins();
}

// ✅ FIX: switchTab uses explicit IDs
function switchTab(tab) {
  activeTab = tab;
  document.getElementById('tabVideos').classList.toggle('active', tab === 'videos');
  document.getElementById('tabLiked').classList.toggle('active', tab === 'liked');

  if (tab === 'liked') {
    // ✅ FIX: Anyone can see own likes, others see public likes
    loadLikedVideos();
  } else {
    loadVideos(viewingProfile.id);
  }
}

async function loadVideos(userId) {
  document.getElementById('videoGrid').innerHTML = '<div class="loader" style="grid-column:1/-1"><div class="spinner"></div></div>';
  const { data: vids } = await sb.from('videos').select('id,video_url,likes_count,views_count').eq('user_id', userId).eq('is_public', true).order('created_at', { ascending: false });
  renderGrid(vids, 'videos');
}

async function loadLikedVideos() {
  document.getElementById('videoGrid').innerHTML = '<div class="loader" style="grid-column:1/-1"><div class="spinner"></div></div>';

  // ✅ FIX: Use viewingProfile.id not currentUser.id (allows viewing others' liked videos)
  const { data } = await sb.from('likes').select('videos(id,video_url,likes_count,views_count)').eq('user_id', viewingProfile.id).order('created_at', { ascending: false });
  const vids = data?.map(d => d.videos).filter(Boolean) || [];
  renderGrid(vids, 'liked');
}

function renderGrid(vids, type) {
  const grid = document.getElementById('videoGrid');
  if (!vids || vids.length === 0) {
    grid.innerHTML = `<div class="empty-state"><div class="emoji">${type === 'liked' ? '❤️' : '🎬'}</div><p>${type === 'liked' ? 'Tiada video dilike lagi' : (isOwnProfile ? 'Upload video pertama kau!' : 'Tiada video lagi')}</p>${isOwnProfile && type === 'videos' ? `<a href="upload.html" style="color:var(--accent);font-weight:600;display:block;margin-top:10px;">Upload →</a>` : ''}</div>`;
    return;
  }
  grid.innerHTML = vids.map(v => `
    <div class="video-thumb" onclick="window.location.href='video.html?id=${v.id}'">
      <video src="${v.video_url}" muted preload="metadata"></video>
      <div class="thumb-overlay"></div>
      <div class="thumb-stats">${type === 'liked' ? '❤️' : '▶'} ${formatCount(type === 'liked' ? v.likes_count : v.views_count)}</div>
    </div>`).join('');
}

function updateFollowBtn() {
  const btn = document.getElementById('followBtn');
  if (!btn) return;
  btn.textContent = isFollowing ? 'Following' : 'Follow';
  btn.className = 'btn-follow' + (isFollowing ? ' following' : '');
}

async function toggleFollow() {
  if (!currentUser) return window.location.href = 'auth.html';
  if (isFollowing) {
    await sb.from('follows').delete().eq('follower_id', currentUser.id).eq('following_id', viewingProfile.id);
    isFollowing = false;
    viewingProfile.followers_count = Math.max(0, (viewingProfile.followers_count || 1) - 1);
  } else {
    await sb.from('follows').insert({ follower_id: currentUser.id, following_id: viewingProfile.id });
    isFollowing = true;
    viewingProfile.followers_count = (viewingProfile.followers_count || 0) + 1;
  }
  updateFollowBtn();
  renderHeader(viewingProfile);
}

function openEditModal() {
  document.getElementById('editDisplayName').value = viewingProfile.display_name || '';
  document.getElementById('editUsername').value = viewingProfile.username || '';
  document.getElementById('editBio').value = viewingProfile.bio || '';
  document.getElementById('editModal').classList.add('open');
}

function closeEditOnOverlay(e) {
  if (e.target === e.currentTarget) document.getElementById('editModal').classList.remove('open');
}

async function saveProfile() {
  const display_name = document.getElementById('editDisplayName').value.trim();
  const username = document.getElementById('editUsername').value.trim().toLowerCase();
  const bio = document.getElementById('editBio').value.trim();
  if (!display_name || !username) return alert('Nama dan username wajib diisi.');
  if (!/^[a-z0-9_]+$/.test(username)) return alert('Username: huruf kecil, nombor dan _ sahaja.');
  const { error } = await sb.from('profiles').update({ display_name, username, bio }).eq('id', currentUser.id);
  if (error) return alert('Gagal save: ' + error.message);
  viewingProfile = { ...viewingProfile, display_name, username, bio };
  document.getElementById('topUsername').textContent = '@' + username;
  renderHeader(viewingProfile);
  document.getElementById('editModal').classList.remove('open');
}

async function uploadAvatar(input) {
  const file = input.files[0];
  if (!file) return;
  const ext = file.name.split('.').pop();
  const path = `${currentUser.id}/avatar.${ext}`;
  const { error: upErr } = await sb.storage.from('avatars').upload(path, file, { upsert: true });
  if (upErr) return alert('Gagal upload: ' + upErr.message);
  const { data: { publicUrl } } = sb.storage.from('avatars').getPublicUrl(path);
  await sb.from('profiles').update({ avatar_url: publicUrl }).eq('id', currentUser.id);
  document.getElementById('profileAvatar').src = publicUrl + '?t=' + Date.now();
}

async function loadProfileCoins() {
  const { data: w } = await sb.from('user_coins').select('coins').eq('user_id', currentUser.id).maybeSingle();
  const el = document.getElementById('profileCoinsAmt');
  if (el) el.textContent = formatCount(w?.coins || 0);
}

function showOptions() {
  const existing = document.getElementById('optionsSheet');
  if (existing) { existing.remove(); return; }

  const sheet = document.createElement('div');
  sheet.id = 'optionsSheet';
  sheet.style.cssText = 'position:fixed;inset:0;z-index:400;background:rgba(0,0,0,0.7);display:flex;align-items:flex-end';

  if (isOwnProfile) {
    sheet.innerHTML = `
      <div style="background:#111;border-radius:20px 20px 0 0;padding:16px 16px 40px;width:100%;border:1px solid #222">
        <div style="width:36px;height:4px;background:rgba(255,255,255,0.2);border-radius:2px;margin:0 auto 16px"></div>
        ${[
          ['⚙️', 'Settings', 'settings.html'],
          ['📊', 'Analytics', 'analytics.html'],
          ['💎', 'Wallet & Withdraw', 'wallet.html'],
          ['🏆', 'Leaderboard', 'leaderboard.html'],
          ['💬', 'Messages', 'dm.html'],
        ].map(([icon, label, href]) => `
          <div onclick="window.location.href='${href}'" style="display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid rgba(255,255,255,0.05);cursor:pointer;font-size:15px">
            <span style="font-size:22px">${icon}</span><span>${label}</span>
          </div>`).join('')}
        <div onclick="sb.auth.signOut().then(()=>window.location.href='auth.html')" style="display:flex;align-items:center;gap:14px;padding:14px 4px;cursor:pointer;font-size:15px;color:#ff2d55;margin-top:4px">
          <span style="font-size:22px">🚪</span><span>Log Out</span>
        </div>
        <button onclick="document.getElementById('optionsSheet').remove()" style="width:100%;margin-top:12px;padding:12px;background:rgba(255,255,255,0.07);border:none;border-radius:12px;color:#888;font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer">Batal</button>
      </div>`;
  } else {
    sheet.innerHTML = `
      <div style="background:#111;border-radius:20px 20px 0 0;padding:16px 16px 40px;width:100%;border:1px solid #222">
        <div style="width:36px;height:4px;background:rgba(255,255,255,0.2);border-radius:2px;margin:0 auto 16px"></div>
        <div onclick="openDM()" style="display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid rgba(255,255,255,0.05);cursor:pointer;font-size:15px">
          <span style="font-size:22px">💬</span><span>Hantar Mesej</span>
        </div>
        <div onclick="reportUser()" style="display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid rgba(255,255,255,0.05);cursor:pointer;font-size:15px">
          <span style="font-size:22px">🚩</span><span>Report User</span>
        </div>
        <div onclick="blockUser()" style="display:flex;align-items:center;gap:14px;padding:14px 4px;cursor:pointer;font-size:15px;color:#ff2d55">
          <span style="font-size:22px">🚫</span><span>Block User</span>
        </div>
        <button onclick="document.getElementById('optionsSheet').remove()" style="width:100%;margin-top:12px;padding:12px;background:rgba(255,255,255,0.07);border:none;border-radius:12px;color:#888;font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer">Batal</button>
      </div>`;
  }

  sheet.addEventListener('click', e => { if (e.target === sheet) sheet.remove(); });
  document.body.appendChild(sheet);
}

async function openDM() {
  document.getElementById('optionsSheet')?.remove();
  if (!currentUser) return window.location.href = 'auth.html';
  const { data: convId } = await sb.rpc('get_or_create_conversation', { user_a: currentUser.id, user_b: viewingProfile.id });
  window.location.href = `dm-chat.html?conv=${convId}&user=${viewingProfile.id}`;
}

async function reportUser() {
  document.getElementById('optionsSheet')?.remove();
  if (!currentUser) return window.location.href = 'auth.html';
  const reason = prompt('Sebab report (spam/harassment/other):') || 'other';
  await sb.from('reports').insert({ reporter_id: currentUser.id, reported_user_id: viewingProfile.id, reason: reason.toLowerCase().trim() || 'other' });
  alert('✅ Report dihantar. Terima kasih!');
}

async function blockUser() {
  document.getElementById('optionsSheet')?.remove();
  if (!currentUser) return window.location.href = 'auth.html';
  if (!confirm(`Block @${viewingProfile.username}? Mereka tidak akan nampak profil kau.`)) return;
  await sb.from('blocked_users').insert({ blocker_id: currentUser.id, blocked_id: viewingProfile.id });
  alert('✅ User diblok. Pergi Settings untuk unblock.');
  history.back();
}

init();
</script>
  <script src="js/pwa.js"></script>
</body>
</html>
