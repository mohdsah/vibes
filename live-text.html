<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>VIBES — Live Room</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    :root{--bg:#0a0a0a;--surface:#111;--border:#1e1e1e;--accent:#ff2d55;--text:#f0f0f0;--muted:#555;--gold:#ffd700}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;display:flex;flex-direction:column}

    /* Header */
    .live-header{padding:14px 16px;padding-top:calc(env(safe-area-inset-top,0px) + 14px);background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
    .live-badge{background:var(--accent);color:white;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;letter-spacing:1px;animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
    .back-btn{background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;flex-shrink:0}
    .room-title{flex:1;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .viewer-chip{background:rgba(255,255,255,0.08);border-radius:20px;padding:5px 12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px;flex-shrink:0}

    /* Body */
    .room-body{flex:1;display:flex;flex-direction:column;overflow:hidden}
    .room-hero{padding:20px;background:var(--surface);border-bottom:1px solid var(--border);text-align:center;flex-shrink:0}
    .room-emoji{font-size:52px;margin-bottom:8px}
    .room-topic{font-size:16px;font-weight:700;margin-bottom:4px}
    .room-by{font-size:13px;color:var(--muted)}
    .host-info{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px}
    .host-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid var(--accent)}
    .follow-btn{background:var(--accent);border:none;border-radius:8px;color:white;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;padding:6px 14px;cursor:pointer}
    .follow-btn.following{background:rgba(255,255,255,0.1);border:1px solid var(--border);color:var(--muted)}

    /* Chat */
    .chat-area{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px;min-height:0}
    .chat-area::-webkit-scrollbar{display:none}
    .chat-msg{display:flex;align-items:flex-start;gap:8px}
    .chat-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;flex-shrink:0}
    .chat-bubble{background:rgba(255,255,255,0.06);border-radius:0 12px 12px 12px;padding:8px 12px;max-width:85%}
    .chat-bubble.host-msg{background:rgba(255,45,85,0.1);border-left:2px solid var(--accent)}
    .chat-name{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:2px}
    .chat-name.host-name{color:var(--gold)}
    .chat-text{font-size:14px;line-height:1.4;word-break:break-word}
    .system-line{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}

    /* Input */
    .input-bar{padding:10px 16px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--bg);border-top:1px solid var(--border);display:flex;gap:8px;align-items:center}
    .chat-input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:11px 16px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:16px;outline:none}
    .send-btn{background:var(--accent);border:none;border-radius:50%;width:44px;height:44px;color:white;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}

    /* Ended overlay */
    .ended-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:100}
    .ended-overlay.show{display:flex}

    .spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:40px auto}
    @keyframes spin{to{transform:rotate(360deg)}}
    .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(20,20,20,0.97);border:1px solid #333;border-radius:12px;padding:12px 20px;font-size:14px;color:white;z-index:999;display:none;white-space:nowrap}
    .toast.show{display:block}
  </style>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#ff2d55"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="live-header">
  <button class="back-btn" onclick="leaveRoom()">←</button>
  <span class="live-badge">LIVE</span>
  <span class="room-title" id="roomTitle">Memuatkan...</span>
  <span class="viewer-chip">👁 <span id="viewerCount">0</span></span>
</div>

<div class="room-body">
  <div class="room-hero">
    <div class="room-emoji" id="roomEmoji">💬</div>
    <div class="room-topic" id="roomTopic">—</div>
    <div class="room-by">Live Kotak Teks</div>
    <div class="host-info">
      <img class="host-avatar" id="hostAvatar" src=""/>
      <span id="hostName" style="font-size:13px;font-weight:600">@—</span>
      <button class="follow-btn" id="followBtn" onclick="toggleFollow()">Follow</button>
    </div>
  </div>
  <div class="chat-area" id="chatArea"><div class="spinner"></div></div>
</div>

<div class="input-bar">
  <input class="chat-input" id="msgInput" placeholder="Tulis mesej..." onkeydown="if(event.key==='Enter')sendMsg()"/>
  <button class="send-btn" onclick="sendMsg()">➤</button>
</div>

<div class="ended-overlay" id="endedOverlay">
  <div style="font-size:50px">🏁</div>
  <div style="font-size:20px;font-weight:700;color:white">Room Telah Ditamatkan</div>
  <button onclick="window.location.href='live-list.html'" style="background:var(--accent);border:none;border-radius:12px;color:white;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;padding:13px 28px;cursor:pointer">Lihat Live Lain →</button>
</div>

<script>
let currentUser=null, currentProfile=null, hostProfile=null;
let roomId=null, chatChannel=null;
let viewerCount=0, isFollowing=false;
let myUserId=null;

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2500)}

async function init() {
  currentUser = await getCurrentUser();
  if (!currentUser) return window.location.href = 'auth.html';
  currentProfile = await getCurrentProfile();
  myUserId = currentUser.id;

  const params = new URLSearchParams(window.location.search);
  roomId = params.get('id');
  if (!roomId) return window.location.href = 'live-list.html';

  const { data: room } = await sb.from('live_text_rooms')
    .select('*, profiles(*)').eq('id', roomId).single();

  if (!room || room.status === 'ended') {
    document.getElementById('endedOverlay').classList.add('show'); return;
  }

  hostProfile = room.profiles;
  viewerCount = room.viewer_count || 0;

  document.getElementById('roomTitle').textContent = room.title;
  document.getElementById('roomEmoji').textContent = room.bg_emoji || '💬';
  document.getElementById('roomTopic').textContent = room.topic || room.title;
  document.getElementById('hostAvatar').src = getAvatarUrl(hostProfile);
  document.getElementById('hostName').textContent = '@' + hostProfile.username;
  document.getElementById('viewerCount').textContent = viewerCount;

  // Check follow
  if (currentUser.id !== hostProfile.id) {
    const { data: f } = await sb.from('follows').select('id').eq('follower_id', currentUser.id).eq('following_id', hostProfile.id).maybeSingle();
    isFollowing = !!f;
    updateFollowBtn();
  } else {
    document.getElementById('followBtn').style.display = 'none';
  }

  // Load recent messages
  const { data: msgs } = await sb.from('live_text_messages')
    .select('*, profiles(username, avatar_url)')
    .eq('room_id', roomId).order('created_at', { ascending: true }).limit(50);
  document.getElementById('chatArea').innerHTML = '';
  msgs?.forEach(m => addMsg(m.profiles?.username, m.content, m.is_host, false, getAvatarUrl(m.profiles)));

  subscribeChat();
  subscribeRoomStatus();

  // Notify join
  chatChannel?.send({ type:'broadcast', event:'join', payload:{ userId: currentUser.id, username: currentProfile.username } });
  sb.from('live_text_rooms').update({ viewer_count: viewerCount + 1 }).eq('id', roomId);
}

function subscribeChat() {
  chatChannel = sb.channel(`live-text-${roomId}`, { config: { broadcast: { self: false } } })
    .on('broadcast', { event: 'msg' }, ({ payload }) => {
      addMsg(payload.username, payload.text, payload.isHost, false, payload.avatar);
    })
    .on('broadcast', { event: 'join' }, ({ payload }) => {
      if (payload.userId !== myUserId) {
        viewerCount++;
        document.getElementById('viewerCount').textContent = viewerCount;
        addSystemMsg(`👋 @${payload.username} menyertai`);
      }
    })
    .on('broadcast', { event: 'leave' }, () => {
      viewerCount = Math.max(0, viewerCount - 1);
      document.getElementById('viewerCount').textContent = viewerCount;
    })
    .on('broadcast', { event: 'room-ended' }, () => showEnded())
    .subscribe();
}

function subscribeRoomStatus() {
  sb.channel(`text-room-status-${roomId}`)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'live_text_rooms', filter: `id=eq.${roomId}` },
      ({ new: r }) => { if (r.status === 'ended') showEnded(); })
    .subscribe();
}

function showEnded() { document.getElementById('endedOverlay').classList.add('show'); }

async function sendMsg() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || !chatChannel) return;
  input.value = '';
  chatChannel.send({ type:'broadcast', event:'msg', payload:{
    username: currentProfile.username, text, isHost: false, avatar: getAvatarUrl(currentProfile)
  }});
  sb.from('live_text_messages').insert({ room_id: roomId, user_id: currentUser.id, content: text, is_host: false });
}

function addMsg(username, text, isHost=false, isSystem=false, avatar='') {
  const box = document.getElementById('chatArea');
  const div = document.createElement('div');
  if (isSystem) { div.className='system-line'; div.textContent=text; }
  else {
    div.className = 'chat-msg';
    div.innerHTML = `<img class="chat-avatar" src="${avatar||'https://ui-avatars.com/api/?name=U&background=random&color=fff&bold=true'}" onerror="this.src='https://ui-avatars.com/api/?name=U'"/>
      <div class="chat-bubble ${isHost?'host-msg':''}">
        <div class="chat-name ${isHost?'host-name':''}">${isHost?'👑 ':''}@${username}</div>
        <div class="chat-text">${text}</div>
      </div>`;
  }
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function addSystemMsg(t){ addMsg('',t,false,true); }

async function toggleFollow() {
  if (!currentUser || currentUser.id === hostProfile?.id) return;
  if (isFollowing) {
    await sb.from('follows').delete().eq('follower_id', currentUser.id).eq('following_id', hostProfile.id);
    isFollowing = false;
  } else {
    await sb.from('follows').insert({ follower_id: currentUser.id, following_id: hostProfile.id });
    isFollowing = true;
  }
  updateFollowBtn();
}

function updateFollowBtn() {
  const btn = document.getElementById('followBtn');
  btn.textContent = isFollowing ? 'Following' : 'Follow';
  btn.className = 'follow-btn' + (isFollowing ? ' following' : '');
}

function leaveRoom() {
  chatChannel?.send({ type:'broadcast', event:'leave', payload:{ userId: currentUser?.id } });
  window.location.href = 'live-list.html';
}

window.addEventListener('beforeunload', () => {
  chatChannel?.send({ type:'broadcast', event:'leave', payload:{ userId: currentUser?.id } });
});

init();
</script>
  <script src="js/pwa.js"></script>
</body>
</html>
