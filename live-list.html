<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>VIBES — Live Now</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root { --bg:#0a0a0a; --surface:#111; --border:#1e1e1e; --accent:#ff2d55; --accent2:#ff6b35; --text:#f0f0f0; --muted:#666; --live:#ff3b30; }
    body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

    .top-bar { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; position:sticky; top:0; z-index:10; background:var(--bg); border-bottom:1px solid var(--border); }
    .back-btn { background:none; border:none; color:var(--text); font-size:22px; cursor:pointer; }
    .page-logo { font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:2px; background:linear-gradient(135deg,var(--live),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .golive-link { background:var(--live); border:none; border-radius:8px; color:white; font-family:'DM Sans',sans-serif; font-size:13px; font-weight:700; padding:8px 16px; cursor:pointer; text-decoration:none; display:flex; align-items:center; gap:6px; }

    .page-title { padding:20px 20px 12px; font-size:18px; font-weight:700; display:flex; align-items:center; gap:8px; }
    .live-dot { width:10px; height:10px; background:var(--live); border-radius:50%; animation:pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.6;transform:scale(1.2)} }

    .live-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:3px; padding:0 0 80px; }

    .live-card { position:relative; aspect-ratio:9/16; background:var(--surface); overflow:hidden; cursor:pointer; }
    .live-card-placeholder { width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:40px; background:linear-gradient(135deg,#1a1a2e,#16213e); }
    .live-card-overlay { position:absolute; inset:0; background:linear-gradient(to bottom,rgba(0,0,0,0.3) 0%,transparent 30%,rgba(0,0,0,0.85) 100%); }

    .live-card-top { position:absolute; top:8px; left:8px; display:flex; gap:6px; align-items:center; }
    .live-badge { background:var(--live); color:white; font-size:10px; font-weight:700; padding:3px 7px; border-radius:5px; letter-spacing:1px; animation:livePulse 2s infinite; }
    @keyframes livePulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
    .viewer-badge { background:rgba(0,0,0,0.65); color:white; font-size:11px; padding:3px 7px; border-radius:5px; }

    .live-card-bottom { position:absolute; bottom:0; left:0; right:0; padding:10px; }
    .card-avatar-row { display:flex; align-items:center; gap:7px; margin-bottom:4px; }
    .card-avatar { width:28px; height:28px; border-radius:50%; object-fit:cover; border:2px solid var(--live); }
    .card-username { font-size:12px; font-weight:700; }
    .card-title { font-size:11px; color:rgba(255,255,255,0.75); overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }

    .empty-state { padding:60px 20px; text-align:center; color:var(--muted); }
    .empty-emoji { font-size:48px; margin-bottom:16px; }
    .empty-title { font-size:18px; color:white; margin-bottom:8px; }
    .empty-sub { font-size:14px; line-height:1.5; }

    .bottom-nav { position:fixed; bottom:0; left:0; right:0; z-index:100; height:70px; background:rgba(0,0,0,0.97); display:flex; align-items:center; justify-content:space-around; border-top:1px solid var(--border); }
    .bottom-tab { display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--muted); text-decoration:none; font-size:10px; font-weight:500; transition:color 0.2s; position:relative; }
    .bottom-tab.active { color:white; }
    .upload-tab { background:linear-gradient(135deg,var(--accent),var(--accent2)); width:46px; height:32px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:22px; color:white; }
    .notif-dot { position:absolute; top:-3px; right:-3px; background:var(--accent); color:white; font-size:9px; font-weight:700; padding:1px 5px; border-radius:10px; min-width:16px; text-align:center; display:none; }
    .upload-tab { background:linear-gradient(135deg,var(--accent),var(--accent2)); width:46px; height:32px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:22px; color:white; }

    .spinner { width:30px; height:30px; border:3px solid var(--border); border-top-color:var(--live); border-radius:50%; animation:spin 0.8s linear infinite; margin:40px auto; }
    @keyframes spin { to{transform:rotate(360deg)} }
  </style>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#ff2d55"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
</head>
<body>
<div class="top-bar">
  <button class="back-btn" onclick="history.back()">←</button>
  <span class="page-logo">🔴 LIVE</span>
  <button class="golive-link" onclick="showGoLiveChoice()">🔴 Go Live</button>
</div>

<div class="page-title"><div class="live-dot"></div> Live Sekarang</div>

<!-- Tabs: Video | Text Room -->
<div style="display:flex;gap:0;padding:0 16px 12px;border-bottom:1px solid #1e1e1e;margin-bottom:4px">
  <button id="tab_video" onclick="switchLiveTab('video')" style="flex:1;padding:9px;background:rgba(255,45,85,0.1);border:none;border-bottom:2px solid var(--live);color:white;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:700;cursor:pointer">📹 Live Video</button>
  <button id="tab_text" onclick="switchLiveTab('text')" style="flex:1;padding:9px;background:none;border:none;border-bottom:2px solid transparent;color:#555;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:700;cursor:pointer">💬 Live Kotak</button>
</div>

<div class="live-grid" id="liveGrid">
  <div style="grid-column:1/-1"><div class="spinner"></div></div>
</div>

<!-- Go Live Choice Modal -->
<div id="goLiveModal" style="display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.85);align-items:flex-end;justify-content:center">
  <div style="background:#111;border-radius:24px 24px 0 0;padding:28px 20px calc(env(safe-area-inset-bottom,16px) + 28px);width:100%;max-width:500px">
    <div style="font-size:18px;font-weight:800;margin-bottom:6px;text-align:center">Pilih Jenis Live</div>
    <div style="font-size:13px;color:#555;text-align:center;margin-bottom:24px">Nak live macam mana?</div>
    <a href="go-live.html" style="display:flex;align-items:center;gap:16px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:16px;padding:18px;text-decoration:none;color:white;margin-bottom:12px">
      <div style="font-size:40px;flex-shrink:0">📹</div>
      <div>
        <div style="font-size:16px;font-weight:700;margin-bottom:4px">Live Video</div>
        <div style="font-size:13px;color:#555">Guna kamera phone kau — penonton boleh tengok & hantar gift</div>
      </div>
    </a>
    <a href="go-live-text.html" style="display:flex;align-items:center;gap:16px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:16px;padding:18px;text-decoration:none;color:white;margin-bottom:20px">
      <div style="font-size:40px;flex-shrink:0">💬</div>
      <div>
        <div style="font-size:16px;font-weight:700;margin-bottom:4px">Live Kotak Teks</div>
        <div style="font-size:13px;color:#555">Tanpa kamera — chat je dengan penonton, sesuai bila nak Q&A</div>
      </div>
    </a>
    <button onclick="closeGoLiveChoice()" style="width:100%;padding:14px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;color:#555;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer">Batal</button>
  </div>
</div>

<nav class="bottom-nav">
  <a class="bottom-tab" href="index.html">🏠<span>Home</span></a>
  <a class="bottom-tab" href="search.html">🔍<span>Discover</span></a>
  <a class="bottom-tab" href="upload.html"><div class="upload-tab">＋</div></a>
  <a class="bottom-tab active" href="live-list.html">🔴<span>Live</span></a>
  <a class="bottom-tab" href="profile.html">👤<span>Profile</span></a>
</nav>

<script>
let liveTab = 'video';

function showGoLiveChoice() {
  document.getElementById('goLiveModal').style.display = 'flex';
}
function closeGoLiveChoice() {
  document.getElementById('goLiveModal').style.display = 'none';
}

function switchLiveTab(tab) {
  liveTab = tab;
  document.getElementById('tab_video').style.cssText = `flex:1;padding:9px;background:${tab==='video'?'rgba(255,45,85,0.1)':'none'};border:none;border-bottom:2px solid ${tab==='video'?'var(--live)':'transparent'};color:${tab==='video'?'white':'#555'};font-family:'DM Sans',sans-serif;font-size:14px;font-weight:700;cursor:pointer`;
  document.getElementById('tab_text').style.cssText = `flex:1;padding:9px;background:${tab==='text'?'rgba(255,45,85,0.1)':'none'};border:none;border-bottom:2px solid ${tab==='text'?'var(--live)':'transparent'};color:${tab==='text'?'white':'#555'};font-family:'DM Sans',sans-serif;font-size:14px;font-weight:700;cursor:pointer`;
  if (tab === 'video') loadLive(); else loadTextRooms();
}

async function loadLive() {
  const sixHoursAgo = new Date(Date.now() - 6 * 60 * 60 * 1000).toISOString();
  const { data: rooms } = await sb.from('live_rooms')
    .select('*, profiles(id, username, display_name, avatar_url)')
    .eq('status', 'live').gte('started_at', sixHoursAgo)
    .order('viewer_count', { ascending: false });

  const grid = document.getElementById('liveGrid');
  if (!rooms?.length) {
    grid.innerHTML = `<div style="grid-column:1/-1"><div class="empty-state"><div class="empty-emoji">📡</div><div class="empty-title">Tiada live video sekarang</div><div class="empty-sub">Jadilah yang pertama!</div><button onclick="showGoLiveChoice()" style="margin-top:16px;background:var(--live);color:white;padding:12px 28px;border-radius:12px;font-weight:700;border:none;font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer">🔴 Go Live</button></div></div>`;
    return;
  }
  grid.innerHTML = rooms.map(r => `
    <div class="live-card" onclick="window.location.href='live.html?id=${r.id}'">
      <div class="live-card-placeholder">📹</div>
      <div class="live-card-overlay"></div>
      <div class="live-card-top"><span class="live-badge">LIVE</span><span class="viewer-badge">👁 ${r.viewer_count||0}</span></div>
      <div class="live-card-bottom">
        <div class="card-avatar-row">
          <img class="card-avatar" src="${getAvatarUrl(r.profiles)}" alt="${r.profiles?.username}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(r.profiles?.username||'U')}&background=random&color=fff'"/>
          <span class="card-username">@${r.profiles?.username}</span>
        </div>
        <div class="card-title">${r.title||'Live Stream'}</div>
      </div>
    </div>`).join('');
}

async function loadTextRooms() {
  const sixHoursAgo = new Date(Date.now() - 6 * 60 * 60 * 1000).toISOString();
  const { data: rooms } = await sb.from('live_text_rooms')
    .select('*, profiles(id, username, display_name, avatar_url)')
    .eq('status', 'live').gte('started_at', sixHoursAgo)
    .order('viewer_count', { ascending: false });

  const grid = document.getElementById('liveGrid');
  if (!rooms?.length) {
    grid.innerHTML = `<div style="grid-column:1/-1"><div class="empty-state"><div class="empty-emoji">💬</div><div class="empty-title">Tiada live kotak sekarang</div><div class="empty-sub">Buka room teks kau!</div><button onclick="showGoLiveChoice()" style="margin-top:16px;background:var(--live);color:white;padding:12px 28px;border-radius:12px;font-weight:700;border:none;font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer">💬 Buka Room</button></div></div>`;
    return;
  }
  grid.innerHTML = rooms.map(r => `
    <div class="live-card" onclick="window.location.href='live-text.html?id=${r.id}'">
      <div class="live-card-placeholder" style="font-size:52px;background:${r.bg_color||'#111'}">${r.bg_emoji||'💬'}</div>
      <div class="live-card-overlay"></div>
      <div class="live-card-top"><span class="live-badge" style="background:#3b82f6">KOTAK</span><span class="viewer-badge">👁 ${r.viewer_count||0}</span></div>
      <div class="live-card-bottom">
        <div class="card-avatar-row">
          <img class="card-avatar" src="${getAvatarUrl(r.profiles)}" alt="${r.profiles?.username}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(r.profiles?.username||'U')}&background=random&color=fff'"/>
          <span class="card-username">@${r.profiles?.username}</span>
        </div>
        <div class="card-title">${r.title||'Live Kotak'}</div>
      </div>
    </div>`).join('');
}

// Realtime
sb.channel('live-all-realtime')
  .on('postgres_changes',{event:'*',schema:'public',table:'live_rooms'},()=>{if(liveTab==='video')loadLive()})
  .on('postgres_changes',{event:'*',schema:'public',table:'live_text_rooms'},()=>{if(liveTab==='text')loadTextRooms()})
  .subscribe();

loadLive();
setInterval(()=>{ liveTab==='video' ? loadLive() : loadTextRooms(); }, 60000);
</script>
  <script src="js/pwa.js"></script>
</body>
</html>
